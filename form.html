<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#fbfaf5">
    <link rel="stylesheet" href="style.css">
    <title>Contact Form</title>
</head>
<body class="form-page">
    <main class="form-card">
        <h1>Contact Us</h1>
        <p class="intro">Have a question? Fill out the form and we’ll get back to you.</p>

        <form id="contact-form">
            <div class="field">
                <label for="name">Name</label>
                <input id="name" name="name" type="text" placeholder="Your name" autocomplete="name" required>
            </div>

            <div class="field">
                <label for="email">Email</label>
                <input id="email" name="email" type="email" placeholder="you@example.com" autocomplete="email" required>
            </div>

            <div class="field">
                <label for="message">Message</label>
                <textarea id="message" name="message" placeholder="How can we help?" required></textarea>
            </div>

            <button type="submit">Send Message</button>
            <p id="form-feedback" role="status" aria-live="polite"></p>
        </form>
    </main>
    <script>
        const contactForm = document.querySelector('#contact-form');
        const feedback = document.querySelector('#form-feedback');
        contactForm.addEventListener('submit', event => {
            event.preventDefault();
            if (!contactForm.reportValidity()) return;
            const data = new FormData(contactForm);
            const subject = encodeURIComponent(`Website message from ${data.get('name')}`);
            const body = encodeURIComponent(`From: ${data.get('name')} (${data.get('email')})\n\n${data.get('message')}`);
            feedback.textContent = 'Your email app is opening with your message ready to send.';
            window.location.href = `mailto:hello@example.com?subject=${subject}&body=${body}`;
        });
    </script>
</body>
</html>
